name: Stock Check Citti-Park

on:
  schedule:
    # Every 15 minutes during store hours (7:00-22:00 CET = 5:00-20:00 UTC)
    - cron: '*/15 5-20 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (stealth)
        run: |
          npm install rebrowser-playwright || npm install playwright
          npx rebrowser-playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium --with-deps

      - name: Run store stock scraper
        run: node scripts/scrape-store-stock.mjs > data/stock-cache.json 2> scraper.log

      - name: Show scraper log
        if: always()
        run: cat scraper.log

      - name: Validate output
        run: |
          if [ ! -s data/stock-cache.json ]; then
            echo "ERROR: stock-cache.json is empty"
            exit 1
          fi
          node -e "const d=JSON.parse(require('fs').readFileSync('data/stock-cache.json','utf8')); console.log('Products:', d.totalProducts, 'Available:', d.availableCount);"

      - name: Commit and push stock cache
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data/stock-cache.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update stock cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
